<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1c1c22"/></marker></defs>
<rect width="860" height="560" fill="#fbfbfd"/>
<text x="430.0" y="34.0" font-family="Georgia,serif" font-size="17" fill="#1c1c22" text-anchor="middle" font-weight="bold" font-style="normal">The dimension ladder, and where the constraints come from</text>
<text x="430.0" y="54.0" font-family="Georgia,serif" font-size="12" fill="#6b6b78" text-anchor="middle" font-weight="normal" font-style="normal">X5D — every EXPDB bound is a shadow of one five-dimensional region</text>
<text x="235.0" y="78.0" font-family="Georgia,serif" font-size="11" fill="#6b6b78" text-anchor="middle" font-weight="bold" font-style="normal">DOWNSTREAM — bounds flow out</text>
<rect x="120" y="90" width="230" height="52" rx="4" fill="none" stroke="#2f6fb5" stroke-width="1.4"/>
<text x="235.0" y="113.0" font-family="Georgia,serif" font-size="14" fill="#1c1c22" text-anchor="middle" font-weight="bold" font-style="normal">𝒫 ⊂ ℝ⁵</text>
<text x="235.0" y="129.0" font-family="Georgia,serif" font-size="11" fill="#6b6b78" text-anchor="middle" font-weight="normal" font-style="normal">the master region (LVER)</text>
<rect x="120" y="182" width="230" height="52" rx="4" fill="none" stroke="#1c1c22" stroke-width="1.4"/>
<text x="235.0" y="205.0" font-family="Georgia,serif" font-size="14" fill="#1c1c22" text-anchor="middle" font-weight="bold" font-style="normal">R ⊂ ℝ³</text>
<text x="235.0" y="221.0" font-family="Georgia,serif" font-size="11" fill="#6b6b78" text-anchor="middle" font-weight="normal" font-style="normal">large-value / energy region</text>
<rect x="120" y="274" width="230" height="52" rx="4" fill="none" stroke="#1c1c22" stroke-width="1.4"/>
<text x="235.0" y="297.0" font-family="Georgia,serif" font-size="14" fill="#1c1c22" text-anchor="middle" font-weight="bold" font-style="normal">f(σ)</text>
<text x="235.0" y="313.0" font-family="Georgia,serif" font-size="11" fill="#6b6b78" text-anchor="middle" font-weight="normal" font-style="normal">a rational function</text>
<rect x="120" y="366" width="230" height="52" rx="4" fill="none" stroke="#1c1c22" stroke-width="1.4"/>
<text x="235.0" y="389.0" font-family="Georgia,serif" font-size="14" fill="#1c1c22" text-anchor="middle" font-weight="bold" font-style="normal">f*(σ)</text>
<text x="235.0" y="405.0" font-family="Georgia,serif" font-size="11" fill="#6b6b78" text-anchor="middle" font-weight="normal" font-style="normal">the lower envelope</text>
<rect x="120" y="458" width="230" height="52" rx="4" fill="none" stroke="#1c1c22" stroke-width="1.4"/>
<text x="235.0" y="481.0" font-family="Georgia,serif" font-size="14" fill="#1c1c22" text-anchor="middle" font-weight="bold" font-style="normal">θ ∈ ℝ⁰</text>
<text x="235.0" y="497.0" font-family="Georgia,serif" font-size="11" fill="#6b6b78" text-anchor="middle" font-weight="normal" font-style="normal">one number</text>
<line x1="235.0" y1="142.0" x2="235.0" y2="178.0" stroke="#6b6b78" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="243.0" y="164.0" font-family="Georgia,serif" font-size="12" fill="#6b6b78" text-anchor="start" font-weight="normal" font-style="italic">π   (drop coordinates)</text>
<line x1="235.0" y1="234.0" x2="235.0" y2="270.0" stroke="#6b6b78" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="243.0" y="256.0" font-family="Georgia,serif" font-size="12" fill="#6b6b78" text-anchor="start" font-weight="normal" font-style="italic">sup_τ ρ/τ</text>
<line x1="235.0" y1="326.0" x2="235.0" y2="362.0" stroke="#6b6b78" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="243.0" y="348.0" font-family="Georgia,serif" font-size="12" fill="#6b6b78" text-anchor="start" font-weight="normal" font-style="italic">env⁻   (pointwise min)</text>
<line x1="235.0" y1="418.0" x2="235.0" y2="454.0" stroke="#6b6b78" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="243.0" y="440.0" font-family="Georgia,serif" font-size="12" fill="#6b6b78" text-anchor="start" font-weight="normal" font-style="italic">sup_σ</text>
<text x="660.0" y="78.0" font-family="Georgia,serif" font-size="11" fill="#6b6b78" text-anchor="middle" font-weight="bold" font-style="normal">UPSTREAM — constraints flow in</text>
<rect x="560" y="150" width="200" height="46" rx="4" fill="none" stroke="#2e7d5b" stroke-width="1.4"/>
