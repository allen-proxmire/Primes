<text x="660.0" y="186.0" font-family="Georgia,serif" font-size="11" fill="#6b6b78" text-anchor="middle" font-weight="normal" font-style="normal">exponent pairs</text>
<path d="M 560 173.0 C 490 173.0, 420 116.0, 356 116.0" fill="none" stroke="#2e7d5b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="546.0" y="167.0" font-family="Georgia,serif" font-size="10" fill="#2e7d5b" text-anchor="end" font-weight="normal" font-style="italic">ep_to_lver</text>
<rect x="560" y="226" width="200" height="46" rx="4" fill="none" stroke="#2e7d5b" stroke-width="1.4"/>
<text x="660.0" y="246.0" font-family="Georgia,serif" font-size="14" fill="#1c1c22" text-anchor="middle" font-weight="bold" font-style="normal">β* ⊂ ℝ¹</text>
<text x="660.0" y="262.0" font-family="Georgia,serif" font-size="11" fill="#6b6b78" text-anchor="middle" font-weight="normal" font-style="normal">beta envelope</text>
<path d="M 560 249.0 C 490 249.0, 420 116.0, 356 116.0" fill="none" stroke="#2e7d5b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="546.0" y="243.0" font-family="Georgia,serif" font-size="10" fill="#2e7d5b" text-anchor="end" font-weight="normal" font-style="italic">beta_to_zlv</text>
<rect x="560" y="302" width="200" height="46" rx="4" fill="none" stroke="#2e7d5b" stroke-width="1.4"/>
<text x="660.0" y="322.0" font-family="Georgia,serif" font-size="14" fill="#1c1c22" text-anchor="middle" font-weight="bold" font-style="normal">𝒞_μ ⊂ ℝ²</text>
<text x="660.0" y="338.0" font-family="Georgia,serif" font-size="11" fill="#6b6b78" text-anchor="middle" font-weight="normal" font-style="normal">mu hull</text>
<path d="M 560 325.0 C 490 325.0, 420 116.0, 356 116.0" fill="none" stroke="#2e7d5b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="546.0" y="319.0" font-family="Georgia,serif" font-size="10" fill="#2e7d5b" text-anchor="end" font-weight="normal" font-style="italic">mu_to_zlv</text>
<text x="660.0" y="372.0" font-family="Georgia,serif" font-size="11" fill="#6b6b78" text-anchor="middle" font-weight="normal" font-style="normal">these sit in ℝ², below 𝒫 — but they feed</text>
<text x="660.0" y="388.0" font-family="Georgia,serif" font-size="11" fill="#6b6b78" text-anchor="middle" font-weight="bold" font-style="normal">UP into it, not down from it</text>
<text x="430.0" y="524.0" font-family="Georgia,serif" font-size="10" fill="#6b6b78" text-anchor="middle" font-weight="normal" font-style="normal">Drawn 2026-09-20 from the figure specification in X5D_EXPDB_Reinterpretation.md §1.</text>
